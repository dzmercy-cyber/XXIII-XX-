<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Question ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 40%,#42182a,#180b13 45%,#07070a 100%);
    color:white;
    font-family:'Cormorant Garamond',serif;
    overflow:hidden;
}

.glow{
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    background:#d43d78;
    filter:blur(170px);
    opacity:.13;
    animation:pulse 5s infinite alternate;
}

@keyframes pulse{
    to{
        transform:scale(1.2);
        opacity:.2;
    }
}

.container{
    width:min(650px,90%);
    text-align:center;
    position:relative;
    z-index:2;
    animation:appear 1.5s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.chapter{
    font-size:11px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#c9a4b2;
    margin-bottom:20px;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:clamp(48px,7vw,75px);
    font-weight:400;
    color:#ffe8ef;
    line-height:1;
}

.question{
    margin:28px auto 25px;
    max-width:570px;
    font-size:23px;
    line-height:1.5;
    color:#ead6dc;
}

.question span{
    color:#ff86a9;
}

/* =========================
   CUTE ANIMATED TEXT BOX
========================= */

.input-wrapper{
    position:relative;
    width:100%;
    border-radius:20px;
    padding:2px;

    background:
        linear-gradient(
            90deg,
            #59243b,
            #ff719c,
            #7e3154,
            #ff9bb8,
            #59243b
        );

    background-size:300% 100%;

    animation:borderFlow 5s linear infinite;

    box-shadow:
        0 0 0 rgba(255,80,140,0),
        0 0 25px rgba(255,80,140,.05);
}

@keyframes borderFlow{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

.input-wrapper::before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:23px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,105,155,.35),
        transparent
    );

    background-size:200% 100%;

    animation:borderShimmer 3.5s linear infinite;

    filter:blur(7px);
    opacity:.5;

    pointer-events:none;
}

@keyframes borderShimmer{

    0%{
        background-position:-100% 0;
    }

    100%{
        background-position:200% 0;
    }
}

textarea{
    position:relative;
    display:block;

    width:100%;
    height:180px;

    resize:none;

    border:none;
    border-radius:18px;

    background:rgba(15,7,12,.94);

    color:#ffeaf1;

    padding:20px;

    outline:none;

    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    line-height:1.5;

    transition:.4s;
}

textarea::placeholder{
    color:#806571;
    transition:.4s;
}

textarea:focus::placeholder{
    color:#a97d8c;
}

.input-wrapper:focus-within{
    box-shadow:
        0 0 18px rgba(255,80,140,.18),
        0 0 45px rgba(255,80,140,.08);
}

textarea:focus{
    background:rgba(18,8,14,.97);
}

/* little heart that appears near the box */

.input-wrapper::after{
    content:"♡";

    position:absolute;

    right:16px;
    bottom:10px;

    color:#ff719c;
    font-size:18px;

    opacity:.35;

    animation:heartBeat 2s ease-in-out infinite;

    pointer-events:none;
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
        opacity:.25;
    }

    50%{
        transform:scale(1.25);
        opacity:.7;
    }
}

/* =========================
   COUNTER
========================= */

.counter{
    text-align:right;
    color:#806571;
    font-size:13px;
    margin-top:8px;
}

.counter.warning{
    color:#ff729c;
}

button{
    margin-top:22px;
    padding:13px 35px;
    border-radius:40px;
    border:1px solid #a34063;
    background:rgba(130,30,65,.2);
    color:#ffeaf1;
    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    cursor:pointer;
    transition:.4s;
}

button:hover{
    background:#a72e59;
    transform:translateY(-3px);
    box-shadow:0 12px 35px rgba(255,60,120,.2);
}

.error{
    color:#ff729c;
    font-size:14px;
    margin-top:12px;
    min-height:20px;
}

/* =========================
   FLOATING HEARTS
========================= */

.heart{
    position:fixed;
    color:#ff729c;
    opacity:.2;
    animation:float 9s linear infinite;
}

.a{left:10%;animation-delay:1s;}
.b{left:88%;animation-delay:4s;}
.c{left:25%;animation-delay:6s;}

@keyframes float{

    from{
        transform:translateY(110vh) scale(.6);
        opacity:0;
    }

    20%{
        opacity:.3;
    }

    to{
        transform:translateY(-15vh) scale(1.1);
        opacity:0;
    }
}

@media(max-width:600px){

    .question{
        font-size:20px;
    }

    textarea{
        height:160px;
    }

}
</style>
</head>

<body>

<div class="glow"></div>

<div class="heart a">♡</div>
<div class="heart b">♥</div>
<div class="heart c">♡</div>

<div class="container">

    <div class="chapter">
        little question · 01
    </div>

    <h1>
        If he's your real one...
    </h1>

    <div class="question">
        Tell me, <span>what do you love most about him?</span>
        <br>
        Don't overthink it. Just say what your heart feels.
    </div>

    <!-- ANIMATED ANSWER BOX -->

    <div class="input-wrapper">

        <textarea
            id="answer"
            maxlength="150"
            placeholder="Write it from your heart... ♡"
            oninput="countWords()"
        ></textarea>

    </div>

    <div class="counter" id="counter">
        0 / 150 words
    </div>

    <div class="error" id="error"></div>

    <button onclick="submitAnswer()">
        That's my answer ♡
    </button>

</div>

<script>

function countWords(){

    const box=document.getElementById("answer");
    const counter=document.getElementById("counter");

    let text=box.value.trim();

    let words=text
        ? text.split(/\s+/).length
        : 0;

    counter.innerText=words+" / 150 words";

    if(words>=140){
        counter.classList.add("warning");
    }else{
        counter.classList.remove("warning");
    }

}

function submitAnswer(){

    const box=document.getElementById("answer");
    const error=document.getElementById("error");

    let text=box.value.trim();

    if(!text){
        error.innerText="Come on... give me a little answer ♡";
        return;
    }

    let words=text.split(/\s+/).length;

    if(words>150){
        error.innerText="Keep it within 150 words ♡";
        return;
    }

    error.innerText="";

    document.body.style.transition="1s ease";
    document.body.style.opacity="0";

    setTimeout(function(){

        window.location.href="card.html";

    },1000);

}

</script>

</body>
</html>
