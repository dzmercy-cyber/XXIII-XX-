<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Something From Your Heart ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle at 50% 40%,#42182a,#190b13 45%,#07070a 100%);

    color:white;
    font-family:'Cormorant Garamond',serif;
}

.glow{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:#d43d78;
    filter:blur(180px);
    opacity:.12;
    animation:glowPulse 6s ease-in-out infinite alternate;
}

@keyframes glowPulse{
    from{
        transform:scale(.9);
        opacity:.08;
    }
    to{
        transform:scale(1.25);
        opacity:.2;
    }
}

.heart{
    position:fixed;
    color:#ff719c;
    font-size:20px;
    opacity:0;
    animation:floatHeart 10s linear infinite;
    pointer-events:none;
}

.h1{left:8%;animation-delay:0s;}
.h2{left:20%;animation-delay:3s;}
.h3{left:80%;animation-delay:1s;}
.h4{left:92%;animation-delay:5s;}
.h5{left:47%;animation-delay:7s;}

@keyframes floatHeart{
    0%{
        transform:translateY(110vh) scale(.5);
        opacity:0;
    }
    20%{
        opacity:.25;
    }
    80%{
        opacity:.2;
    }
    100%{
        transform:translateY(-15vh) scale(1);
        opacity:0;
    }
}

.container{
    width:min(700px,92%);
    text-align:center;
    position:relative;
    z-index:5;
    animation:pageIn 1.2s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.chapter{
    font-size:11px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#c9a4b2;
    margin-bottom:18px;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:clamp(50px,7vw,78px);
    font-weight:400;
    color:#ffe8ef;
    line-height:1;
}

.question-number{
    margin-top:18px;
    color:#ff719c;
    font-size:13px;
    letter-spacing:3px;
}

.question{
    margin:18px auto 25px;
    max-width:620px;
    color:#ead6dc;
    font-size:23px;
    line-height:1.5;
}

.question span{
    color:#ff86a9;
}

.input-wrapper{
    position:relative;
    width:100%;
    border-radius:20px;
    padding:2px;

    background:
        linear-gradient(
            90deg,
            #59243b,
            #ff719c,
            #7e3154,
            #ff9bb8,
            #59243b
        );

    background-size:300% 100%;
    animation:borderFlow 5s linear infinite;

    box-shadow:
        0 0 30px rgba(255,70,130,.06);
}

@keyframes borderFlow{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

.input-wrapper::before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:23px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,105,155,.35),
            transparent
        );

    background-size:200% 100%;
    animation:shimmer 3.5s linear infinite;

    filter:blur(7px);
    opacity:.5;
    pointer-events:none;
}

@keyframes shimmer{
    from{
        background-position:-100% 0;
    }
    to{
        background-position:200% 0;
    }
}

textarea{
    position:relative;
    display:block;

    width:100%;
    height:170px;

    resize:none;
    border:none;
    border-radius:18px;
    outline:none;

    background:rgba(15,7,12,.96);
    color:#ffeaf1;

    padding:20px;

    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    line-height:1.5;
}

textarea::placeholder{
    color:#806571;
}

.input-wrapper::after{
    content:"♡";
    position:absolute;
    right:15px;
    bottom:9px;

    color:#ff719c;
    font-size:18px;
    opacity:.35;

    animation:heartBeat 2s ease-in-out infinite;
    pointer-events:none;
}

@keyframes heartBeat{
    0%,100%{
        transform:scale(1);
        opacity:.25;
    }
    50%{
        transform:scale(1.25);
        opacity:.7;
    }
}

.counter{
    text-align:right;
    color:#806571;
    font-size:13px;
    margin-top:7px;
}

.counter.warning{
    color:#ff729c;
}

.next{
    margin-top:20px;
    padding:12px 34px;

    border-radius:40px;
    border:1px solid #a34063;

    background:rgba(130,30,65,.2);
    color:#ffeaf1;

    font-family:'Cormorant Garamond',serif;
    font-size:17px;

    cursor:pointer;
    transition:.4s;
}

.next:hover{
    background:#a72e59;
    transform:translateY(-3px);

    box-shadow:
        0 12px 35px rgba(255,60,120,.2);
}

.error{
    min-height:20px;
    margin-top:10px;
    color:#ff729c;
    font-size:14px;
}

/* TRANSITION */

.transition{
    position:fixed;
    inset:0;
    z-index:100;

    pointer-events:none;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(80,20,40,.9),
            rgba(5,4,7,1)
        );

    opacity:0;
    transition:.8s ease;
}

.transition.active{
    opacity:1;
}

.transition-heart{
    font-size:55px;
    color:#ff719c;
    opacity:0;
    transform:scale(.2);

    text-shadow:
        0 0 20px rgba(255,80,140,.4),
        0 0 50px rgba(255,80,140,.2);
}

.transition.active .transition-heart{
    animation:heartReveal 1.5s ease forwards;
}

@keyframes heartReveal{
    0%{
        opacity:0;
        transform:scale(.2);
    }
    35%{
        opacity:1;
        transform:scale(1.3);
    }
    60%{
        transform:scale(1);
    }
    100%{
        opacity:0;
        transform:scale(2);
    }
}

.fly-heart{
    position:fixed;
    left:50%;
    top:50%;

    color:#ff719c;
    font-size:20px;

    pointer-events:none;
    z-index:110;

    animation:flyHeart 1.4s ease-out forwards;
}

@keyframes flyHeart{
    0%{
        transform:
            translate(-50%,-50%)
            scale(.3);
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.2)
            rotate(var(--r));
        opacity:0;
    }
}

/* FINISH */

.finish{
    display:none;
    animation:finishIn 1.2s ease;
}

@keyframes finishIn{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.finish h2{
    font-family:'Great Vibes',cursive;
    font-size:65px;
    font-weight:400;
    color:#ffe8ef;
}

.finish p{
    margin-top:15px;
    color:#c9a4b2;
    font-size:19px;
    font-style:italic;
}

.finish-button{
    margin-top:25px;
    padding:13px 32px;

    border-radius:40px;
    border:1px solid #a34063;

    background:rgba(130,30,65,.2);
    color:#ffeaf1;

    font-family:'Cormorant Garamond',serif;
    font-size:17px;

    cursor:pointer;
}

@media(max-width:600px){

    .question{
        font-size:20px;
    }

    textarea{
        height:155px;
    }

    .finish h2{
        font-size:55px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="heart h1">♡</div>
<div class="heart h2">♥</div>
<div class="heart h3">♡</div>
<div class="heart h4">♥</div>
<div class="heart h5">♡</div>


<div class="transition" id="transition">

    <div class="transition-heart">
        ♡
    </div>

</div>


<div class="container" id="game">

    <div class="chapter">
        something from your heart · 03
    </div>

    <h1>
        A Little Game
    </h1>

    <div class="question-number" id="number">
        QUESTION 01 / 05
    </div>

    <div class="question" id="question">
        What is the one thing
        <span>you love most about me?</span>
    </div>

    <div class="input-wrapper">

        <textarea
            id="answer"
            maxlength="1000"
            placeholder="Write it from your heart... ♡"
            oninput="countWords()"
        ></textarea>

    </div>

    <div class="counter" id="counter">
        0 / 100 words
    </div>

    <div class="error" id="error"></div>

    <button class="next" onclick="nextQuestion()">
        Next question ♡
    </button>

</div>


<div class="container finish" id="finish">

    <div class="chapter">
        you made it through · ♡
    </div>

    <h2>
        You know us pretty well...
    </h2>

    <p>
        And I hope you know how much these little answers mean to me.
    </p>

    <button
        class="finish-button"
        onclick="goFinal()">

        One last thing →

    </button>

</div>


<script>

const questions = [

    "What is the one thing you <span>love most about me?</span>",

    "What is your <span>favourite memory</span> of us?",

    "What is one little thing I do that <span>always makes you smile?</span>",

    "When do you feel <span>closest to me?</span>",

    "If you could make one wish for <span>our relationship</span>, what would it be?"

];

let currentQuestion=0;


/* WORD COUNTER */

function countWords(){

    const answer=document.getElementById("answer");
    const counter=document.getElementById("counter");

    let text=answer.value.trim();

    let words=text
        ? text.split(/\s+/).length
        : 0;

    counter.innerText=
        words+" / 100 words";

    if(words>=90){
        counter.classList.add("warning");
    }else{
        counter.classList.remove("warning");
    }
}


/* NEXT QUESTION */

function nextQuestion(){

    const answer=document.getElementById("answer");
    const error=document.getElementById("error");

    let text=answer.value.trim();

    if(!text){

        error.innerText=
            "Don't leave this one empty... tell me what you feel ♡";

        return;
    }

    let words=text.split(/\s+/).length;

    if(words>100){

        error.innerText=
            "Keep your answer within 100 words ♡";

        return;
    }

    error.innerText="";


    /* SAVE ANSWER */

    localStorage.setItem(
        "question"+(currentQuestion+1),
        text
    );


    /* HEART PARTICLES */

    createHeartParticles();


    /* TRANSITION */

    const transition=
        document.getElementById("transition");

    transition.classList.add("active");


    setTimeout(function(){

        if(currentQuestion<questions.length-1){

            currentQuestion++;

            changeQuestion();

        }else{

            showFinish();

        }

    },900);


    setTimeout(function(){

        transition.classList.remove("active");

    },1500);

}


/* CHANGE QUESTION */

function changeQuestion(){

    const number=
        document.getElementById("number");

    const question=
        document.getElementById("question");

    const answer=
        document.getElementById("answer");

    const counter=
        document.getElementById("counter");


    number.innerText=
        "QUESTION 0"+
        (currentQuestion+1)+
        " / 05";


    question.innerHTML=
        questions[currentQuestion];


    answer.value="";

    counter.innerText=
        "0 / 100 words";

    counter.classList.remove("warning");


    const game=
        document.getElementById("game");

    game.style.animation="none";

    void game.offsetWidth;

    game.style.animation=
        "pageIn 1s ease";

}


/* HEART PARTICLES */

function createHeartParticles(){

    for(let i=0;i<18;i++){

        const heart=
            document.createElement("div");

        heart.className=
            "fly-heart";

        heart.innerHTML=
            Math.random()>0.5
            ? "♡"
            : "♥";


        heart.style.setProperty(
            "--x",
            ((Math.random()-.5)*500)+"px"
        );

        heart.style.setProperty(
            "--y",
            ((Math.random()-.5)*400)+"px"
        );

        heart.style.setProperty(
            "--r",
            ((Math.random()-.5)*120)+"deg"
        );


        document.body.appendChild(heart);


        setTimeout(function(){

            heart.remove();

        },1500);

    }

}


/* FINISH */

function showFinish(){

    document.getElementById("game").style.display="none";

    const finish=
        document.getElementById("finish");

    finish.style.display="block";


    setTimeout(function(){

        createHeartParticles();

    },300);

}


/* FINAL PAGE */

function goFinal(){

    document.body.style.transition=
        "1s ease";

    document.body.style.opacity="0";

    setTimeout(function(){

        window.location.href=
            "final.html";

    },1000);

}

</script>

</body>
</html>
