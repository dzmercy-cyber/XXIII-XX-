 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(170,55,105,.28),
            transparent 45%
        ),
        radial-gradient(
            circle at 10% 85%,
            rgba(100,30,90,.20),
            transparent 40%
        ),
        #08070b;

    color:white;

    font-family:
        "Cormorant Garamond",
        serif;
}


/* =========================
   MAIN
========================= */

.page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    padding:
        55px 18px 90px;
}


.container{

    width:min(850px,100%);

    text-align:center;
}


/* =========================
   HEADING
========================= */

.small-title{

    font-family:
        "Great Vibes",
        cursive;

    font-size:
        clamp(30px,6vw,42px);

    color:#eab5ce;

    margin-bottom:5px;

    animation:
        fadeDown
        1.2s
        ease
        forwards;
}


.title{

    font-family:
        "Great Vibes",
        cursive;

    font-size:
        clamp(52px,10vw,82px);

    font-weight:400;

    margin-bottom:8px;

    color:white;

    text-shadow:
        0 0 20px rgba(255,100,170,.25);

    animation:
        fadeDown
        1.5s
        ease
        forwards;
}


.subtitle{

    font-size:19px;

    color:
        rgba(255,255,255,.52);

    font-style:italic;

    margin-bottom:45px;

    animation:
        fadeDown
        1.8s
        ease
        forwards;
}


@keyframes fadeDown{

    from{

        opacity:0;

        transform:
            translateY(25px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }

}


/* =========================
   PHOTO AREA
========================= */

.photo-gallery{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:38px;
}


/* =========================
   PHOTO CARD
========================= */

.photo-card{

    width:min(650px,100%);

    padding:12px;

    border-radius:28px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,130,180,.20);

    box-shadow:

        0 20px 70px
        rgba(0,0,0,.45),

        0 0 45px
        rgba(255,50,140,.08);

    backdrop-filter:
        blur(12px);

    opacity:0;

    transform:
        translateY(45px)
        scale(.94);

    animation:
        photoAppear
        1s
        ease
        forwards;

    transition:
        transform .5s ease,
        box-shadow .5s ease;
}


.photo-card:nth-child(1){

    animation-delay:.4s;
}


.photo-card:nth-child(2){

    animation-delay:.8s;
}


.photo-card:nth-child(3){

    animation-delay:1.2s;
}


@keyframes photoAppear{

    from{

        opacity:0;

        transform:
            translateY(45px)
            scale(.94);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================
   PHOTO
========================= */

.photo-card img{

    width:100%;

    display:block;

    border-radius:20px;

    object-fit:cover;

    box-shadow:
        0 8px 35px
        rgba(0,0,0,.35);

    transition:
        transform .6s ease,
        filter .6s ease;
}


.photo-card:hover{

    transform:
        translateY(-7px)
        scale(1.015);

    box-shadow:

        0 25px 80px
        rgba(0,0,0,.55),

        0 0 55px
        rgba(255,70,155,.16);
}


.photo-card:hover img{

    transform:scale(1.015);

    filter:
        brightness(1.05);
}


/* =========================
   CAPTION
========================= */

.caption{

    padding:
        15px 8px 8px;

    font-family:
        "Great Vibes",
        cursive;

    font-size:30px;

    color:#efbad2;

    text-shadow:
        0 0 15px
        rgba(255,100,170,.20);
}


/* =========================
   MESSAGE
========================= */

.message{

    margin-top:55px;

    padding:0 15px;

    font-family:
        "Great Vibes",
        cursive;

    font-size:
        clamp(30px,6vw,42px);

    color:#eab5ce;

    opacity:0;

    animation:
        messageAppear
        1.5s
        ease
        2s
        forwards;
}


@keyframes messageAppear{

    from{

        opacity:0;

        transform:
            translateY(25px);
    }

    to{

        opacity:.9;

        transform:
            translateY(0);
    }

}


.message-small{

    margin-top:8px;

    font-size:17px;

    color:
        rgba(255,255,255,.40);

    font-style:italic;

    opacity:0;

    animation:
        messageAppear
        1.5s
        ease
        2.3s
        forwards;
}


/* =========================
   NEXT BUTTON
========================= */

.next-button{

    display:inline-block;

    margin-top:42px;

    padding:
        14px 30px;

    border-radius:999px;

    border:
        1px solid
        rgba(255,130,180,.35);

    background:
        rgba(255,255,255,.05);

    color:#ffd7e7;

    text-decoration:none;

    font-size:18px;

    letter-spacing:.5px;

    backdrop-filter:
        blur(10px);

    transition:
        .35s ease;

    box-shadow:
        0 0 25px
        rgba(255,60,150,.08);
}


.next-button:hover{

    transform:
        translateY(-4px);

    background:
        rgba(255,100,170,.12);

    box-shadow:

        0 0 35px
        rgba(255,70,160,.25);
}


/* =========================
   FLOATING HEARTS
========================= */

.heart{

    position:fixed;

    bottom:-40px;

    pointer-events:none;

    color:
        rgba(255,110,175,.28);

    animation:
        floatHeart
        linear
        infinite;

    z-index:0;
}


@keyframes floatHeart{

    0%{

        transform:
            translateY(0)
            scale(.6);

        opacity:0;
    }

    20%{

        opacity:.35;
    }

    80%{

        opacity:.20;
    }

    100%{

        transform:
            translateY(-115vh)
            scale(1.2);

        opacity:0;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{

        padding:
            42px 13px 70px;
    }

    .photo-card{

        padding:9px;

        border-radius:22px;
    }

    .photo-card img{

        border-radius:16px;
    }

    .caption{

        font-size:26px;
    }

}

</style>
</head>


<body>


<!-- FLOATING HEARTS -->

<div class="heart"
     style="left:7%;font-size:20px;animation-duration:9s;">
    ♡
</div>

<div class="heart"
     style="left:23%;font-size:15px;animation-duration:12s;animation-delay:2s;">
    ♥
</div>

<div class="heart"
     style="left:48%;font-size:18px;animation-duration:10s;animation-delay:1s;">
    ♡
</div>

<div class="heart"
     style="left:72%;font-size:16px;animation-duration:13s;animation-delay:3s;">
    ♡
</div>

<div class="heart"
     style="left:90%;font-size:21px;animation-duration:11s;animation-delay:4s;">
    ♥
</div>


<div class="page">

<div class="container">


<!-- HEADING -->

<div class="small-title">
    A few moments...
</div>

<h1 class="title">
    Our Memories ❤️
</h1>

<div class="subtitle">
    some moments are too beautiful to be forgotten
</div>


<!-- PHOTOS -->

<div class="photo-gallery">


<div class="photo-card">

    <img
        src="photo1.jpg"
        alt="Our memory"
    >

    <div class="caption">
        one of my favourite moments
    </div>

</div>


<div class="photo-card">

    <img
        src="photo2.jpg"
        alt="Our memory"
    >

    <div class="caption">
        a moment worth remembering
    </div>

</div>


<div class="photo-card">

    <img
        src="photo3.jpg"
        alt="Our memory"
    >

    <div class="caption">
        and this one too ❤️
    </div>

</div>


</div>


<!-- MESSAGE -->

<div class="message">
    I could look at these forever...
</div>

<div class="message-small">
    because every picture carries a little piece of us.
</div>


<!-- NEXT -->

<a
    href="activity1.html"
    class="next-button"
>
    Continue our story →
</a>


</div>

</div>

</body>
</html>
