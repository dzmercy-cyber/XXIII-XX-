<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(150,45,100,.30),
            transparent 42%
        ),
        radial-gradient(
            circle at 10% 80%,
            rgba(90,25,100,.18),
            transparent 40%
        ),
        #08070b;
    color:white;
    font-family:"Cormorant Garamond",serif;
}


/* FLOATING HEARTS */

.heart{
    position:fixed;
    bottom:-50px;
    color:rgba(255,130,185,.35);
    pointer-events:none;
    z-index:0;
    animation:floatHeart linear infinite;
}

@keyframes floatHeart{
    0%{
        transform:translateY(0) scale(.6) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.45;
    }

    80%{
        opacity:.25;
    }

    100%{
        transform:translateY(-115vh) scale(1.2) rotate(25deg);
        opacity:0;
    }
}


/* MAIN */

.page{
    position:relative;
    z-index:1;
    min-height:100vh;
    padding:55px 18px 90px;
}

.container{
    width:min(850px,100%);
    margin:auto;
    text-align:center;
}


/* HEADING */

.intro{
    animation:fadeDown 1.3s ease forwards;
}

.small-title{
    font-family:"Great Vibes",cursive;
    font-size:clamp(30px,6vw,43px);
    color:#e8abc7;
}

.title{
    margin-top:2px;
    font-family:"Great Vibes",cursive;
    font-size:clamp(55px,11vw,85px);
    font-weight:400;
    color:white;
    text-shadow:
        0 0 15px rgba(255,100,170,.25),
        0 0 40px rgba(255,80,160,.12);
}

.subtitle{
    margin-top:5px;
    color:rgba(255,255,255,.52);
    font-size:19px;
    font-style:italic;
}


/* GALLERY */

.gallery{
    margin-top:45px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:42px;
}


/* PHOTO CARD */

.photo-card{
    width:min(700px,100%);
    padding:10px;
    border-radius:27px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,130,180,.22);

    box-shadow:
        0 20px 70px rgba(0,0,0,.48),
        0 0 45px rgba(255,50,140,.08);

    backdrop-filter:blur(12px);

    opacity:0;
    transform:
        translateY(45px)
        scale(.95);

    animation:photoIn 1.1s ease forwards;

    transition:
        transform .5s ease,
        box-shadow .5s ease;
}

.photo-card:nth-child(1){
    animation-delay:.3s;
}

.photo-card:nth-child(2){
    animation-delay:.8s;
}

.photo-card:nth-child(3){
    animation-delay:1.3s;
}

@keyframes photoIn{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.photo-card:hover{
    transform:translateY(-7px) scale(1.012);

    box-shadow:
        0 28px 80px rgba(0,0,0,.55),
        0 0 55px rgba(255,70,160,.18);
}


/* IMAGES */

.photo-card img{
    display:block;
    width:100%;
    height:auto;

    max-height:720px;

    object-fit:contain;

    border-radius:19px;

    background:#050509;

    box-shadow:
        0 8px 35px rgba(0,0,0,.40);

    transition:
        filter .5s ease,
        transform .5s ease;
}

.photo-card:hover img{
    filter:brightness(1.06);
}


/* CAPTION */

.caption{
    padding:15px 5px 7px;

    font-family:"Great Vibes",cursive;

    font-size:30px;

    color:#efb5d0;

    text-shadow:
        0 0 16px rgba(255,100,170,.20);
}


/* MESSAGE */

.message{
    margin-top:60px;

    font-family:"Great Vibes",cursive;

    font-size:clamp(32px,7vw,46px);

    color:#eab2cc;

    opacity:0;

    animation:
        messageIn
        1.5s
        ease
        2s
        forwards;
}

.message-small{
    margin-top:8px;

    color:rgba(255,255,255,.42);

    font-size:18px;

    font-style:italic;

    opacity:0;

    animation:
        messageIn
        1.5s
        ease
        2.3s
        forwards;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* NEXT BUTTON */

.next-button{
    display:inline-block;

    margin-top:40px;

    padding:14px 31px;

    border-radius:999px;

    border:1px solid rgba(255,130,180,.35);

    background:rgba(255,255,255,.045);

    color:#ffd6e7;

    text-decoration:none;

    font-size:18px;

    transition:.35s ease;

    box-shadow:
        0 0 25px rgba(255,60,150,.08);

    backdrop-filter:blur(10px);
}

.next-button:hover{
    transform:translateY(-4px);

    background:rgba(255,100,170,.12);

    box-shadow:
        0 0 35px rgba(255,70,160,.25);
}


/* MOBILE */

@media(max-width:600px){

    .page{
        padding:42px 12px 70px;
    }

    .gallery{
        gap:30px;
        margin-top:35px;
    }

    .photo-card{
        padding:8px;
        border-radius:22px;
    }

    .photo-card img{
        border-radius:16px;
        max-height:none;
    }

    .caption{
        font-size:27px;
    }

    .subtitle{
        font-size:17px;
    }
}
</style>
</head>


<body>

<div class="heart"
     style="left:7%;font-size:20px;animation-duration:10s;">

</div>

<div class="heart"

</div>

<div class="heart"
     style="left:45%;font-size:19px;animation-duration:11s;animation-delay:1s;">
    ♡
</div>

<div class="heart"
     style="left:68%;font-size:16px;animation-duration:14s;animation-delay:3s;">
    ♡
</div>

<div class="heart"
     style="left:88%;font-size:21px;animation-duration:12s;animation-delay:4s;">
    ♥
</div>


<!-- PAGE -->

<div class="page">

<div class="container">


<!-- INTRO -->

<div class="intro">

    <div class="small-title">
        A few moments...
    </div>

    <div class="title">
        Our Memories ❤️
    </div>

    <div class="subtitle">
        some moments are too beautiful to be forgotten
    </div>

</div>


<!-- PHOTO GALLERY -->

<div class="gallery">


<!-- PHOTO 1 -->

<div class="photo-card">

    <img
        src="Snapchat-1434991897%20(1).jpg"
        alt="Our memory">

    <div class="caption">

    </div>

</div>


<!-- PHOTO 2 -->

<div class="photo-card">

    <img
        src="20241208_161721.jpg"
        alt="Our memory">

    <div class="caption">

    </div>

</div>


<!-- PHOTO 3 -->

<div class="photo-card">

    <img
        src="Screenshot_2024-07-09-22-17-46-083_com.miui.gallery.jpg"
        alt="Our memory">

    </div>

</div>


</div>


<!-- MESSAGE -->

<div class="message">

</div>

<div class="message-small">

</div>


<!-- NEXT PAGE -->

<a
    href="activity1.html"
    class="next-button">
    Continue our story →
</a>


</div>

</div>


</body>
</html>
